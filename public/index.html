<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Live Match Stats V5</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:#f5f7fa;
  font-family:system-ui,sans-serif
}

.wrap{
  max-width:950px;
  margin:auto;
  padding:16px
}

.card{
  background:#151b23;
  border:1px solid #29323d;
  border-radius:15px;
  padding:16px;
  margin:12px 0
}

h1,h2{
  margin-top:0
}

.muted{
  color:#9ca7b5
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #374250;
  background:#0b1016;
  color:white;
  font-size:16px
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  margin:9px 6px 0 0;
  font-weight:800;
  cursor:pointer
}

.go{
  background:white;
  color:#111
}

.refresh{
  background:#303946;
  color:white
}

button:disabled{
  opacity:.5
}

.ok{
  color:#8fe29a
}

.err{
  color:#ff9696
}

.loading{
  color:#f1d27c
}

.match{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.teams{
  font-size:22px;
  font-weight:850
}

.score{
  font-size:38px;
  font-weight:900
}

.badge{
  display:inline-block;
  margin-top:7px;
  padding:5px 9px;
  border-radius:20px;
  background:#29323d;
  font-size:12px;
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}

.stat{
  background:#0d131a;
  border-radius:10px;
  padding:12px
}

.name{
  color:#9ca7b5;
  font-size:12px
}

.val{
  margin-top:4px;
  font-size:19px;
  font-weight:800
}

.event{
  background:#0d131a;
  padding:11px;
  border-radius:9px;
  margin:7px 0
}

.hidden{
  display:none
}

pre{
  background:#080c11;
  padding:10px;
  border-radius:9px;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:400px;
  overflow:auto;
  font-size:12px
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }

  .teams{
    font-size:18px
  }

  .score{
    font-size:32px
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>⚽ Live Match Stats V5</h1>

<p class="muted">
Digite os dois times:
</p>

<input
  id="q"
  placeholder="Ex.: FCSB x Sepsi"
>

<button
  id="load"
  class="go"
  onclick="loadMatch()"
>
Carregar
</button>

<button
  id="refresh"
  class="refresh"
  onclick="loadMatch(true)"
>
🔄 Atualizar
</button>

<div
  id="msg"
  class="muted"
></div>

</div>


<div
  id="game"
  class="card hidden"
>

<div class="match">

<div>

<div
  id="teams"
  class="teams"
>
-
</div>

<div
  id="status"
  class="badge"
>
-
</div>

</div>

<div
  id="score"
  class="score"
>
- x -
</div>

</div>

</div>


<div
  id="statsCard"
  class="card hidden"
>

<h2>📊 Estatísticas</h2>

<div
  id="stats"
  class="grid"
></div>

</div>


<div
  id="eventsCard"
  class="card hidden"
>

<h2>🚨 Eventos</h2>

<div id="events"></div>

</div>


<div
  id="rawCard"
  class="card hidden"
>

<h2>🔧 Dados recebidos</h2>

<pre id="raw"></pre>

</div>

</div>


<script>

function message(text,type='muted'){

  const el =
    document.getElementById('msg');

  el.className=type;

  el.textContent=text;
}


function show(id){

  document
    .getElementById(id)
    .classList
    .remove('hidden');
}


function hide(id){

  document
    .getElementById(id)
    .classList
    .add('hidden');
}


function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}


function renderMatch(data){

  const fixture =
    data.fixture;

  if(!fixture){

    throw new Error(
      'A API não retornou a partida.'
    );
  }

  const home =
    fixture.teams?.home?.name ||
    'Casa';

  const away =
    fixture.teams?.away?.name ||
    'Fora';

  const homeScore =
    fixture.goals?.home ?? 0;

  const awayScore =
    fixture.goals?.away ?? 0;

  const status =
    fixture.fixture?.status?.long ||
    fixture.fixture?.status?.short ||
    '-';

  document
    .getElementById('teams')
    .textContent =
      home+' x '+away;

  document
    .getElementById('score')
    .textContent =
      homeScore+' x '+awayScore;

  document
    .getElementById('status')
    .textContent =
      status;

  show('game');

  renderStats(
    data.statistics
  );

  renderEvents(
    data.events
  );
}


function renderStats(statistics){

  const box =
    document.getElementById('stats');

  box.innerHTML='';

  if(
    !statistics ||
    !statistics.length
  ){

    box.innerHTML =
      '<div class="muted">'+
      'Estatísticas não disponíveis.'+
      '</div>';

    show('statsCard');

    return;
  }

  statistics.forEach(team=>{

    const teamName =
      team.team?.name ||
      'Equipe';

    (team.statistics || [])
      .forEach(stat=>{

        const div =
          document.createElement('div');

        div.className='stat';

        div.innerHTML =
          '<div class="name">'+
          escapeHTML(
            teamName+
            ' — '+
            stat.type
          )+
          '</div>'+
          '<div class="val">'+
          escapeHTML(
            stat.value ?? '-'
          )+
          '</div>';

        box.appendChild(div);
      });
  });

  show('statsCard');
}


function renderEvents(events){

  const box =
    document.getElementById('events');

  box.innerHTML='';

  if(
    !events ||
    !events.length
  ){

    box.innerHTML =
      '<div class="muted">'+
      'Nenhum evento disponível.'+
      '</div>';

    show('eventsCard');

    return;
  }

  events
    .slice()
    .reverse()
    .forEach(event=>{

      const div =
        document.createElement('div');

      div.className='event';

      let text='';

      if(event.time?.elapsed){
        text +=
          event.time.elapsed+
          "' — ";
      }

      text +=
        event.type ||
        'Evento';

      if(event.detail){
        text +=
          ' — '+event.detail;
      }

      if(event.team?.name){
        text +=
          ' — '+event.team.name;
      }

      if(event.player?.name){
        text +=
          ' — '+event.player.name;
      }

      div.textContent=text;

      box.appendChild(div);
    });

  show('eventsCard');
}


async function loadMatch(){

  const input =
    document
      .getElementById('q')
      .value
      .trim();

  if(!input){

    message(
      'Digite os dois times.',
      'err'
    );

    return;
  }

  const load =
    document.getElementById('load');

  const refresh =
    document.getElementById('refresh');

  load.disabled=true;
  refresh.disabled=true;

  message(
    '🔎 Procurando partida...',
    'loading'
  );

  try{

    const response =
      await fetch(
        '/api/match?q='+
        encodeURIComponent(input)+
        '&t='+
        Date.now(),
        {
          cache:'no-store'
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      throw new Error(
        result.details ||
        result.error ||
        'Erro no servidor.'
      );
    }

    renderMatch(
      result.data
    );

    document
      .getElementById('raw')
      .textContent =
        JSON.stringify(
          result,
          null,
          2
        );

    show('rawCard');

    message(
      '✅ Dados carregados.',
      'ok'
    );

  }catch(error){

    console.error(error);

    message(
      'Erro: '+error.message,
      'err'
    );

  }finally{

    load.disabled=false;
    refresh.disabled=false;
  }
}


document
  .getElementById('q')
  .addEventListener(
    'keydown',
    e=>{
      if(e.key==='Enter'){
        loadMatch();
      }
    }
  );

</script>

</body>
</html>
