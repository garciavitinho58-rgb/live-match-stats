<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Live Match Stats V4</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#0b0f14;
  color:#f4f6f8;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px
}

.card{
  background:#151b23;
  border:1px solid #28313c;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 8px 30px rgba(0,0,0,.18)
}

h1,h2{
  margin-top:0
}

.muted{
  color:#9ca7b5
}

input{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #35404d;
  background:#0c1117;
  color:#fff;
  font-size:15px;
  outline:none
}

input:focus{
  border-color:#718096
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  margin:9px 6px 0 0;
  font-weight:750;
  cursor:pointer
}

.go{
  background:#fff;
  color:#111
}

.refresh{
  background:#303946;
  color:#fff
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.status{
  margin-top:12px;
  min-height:22px
}

.ok{
  color:#8fe29a
}

.err{
  color:#ff9494
}

.loading{
  color:#f2d27a
}

.match{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.teams{
  font-size:21px;
  font-weight:850
}

.score{
  font-size:38px;
  font-weight:900
}

.badge{
  display:inline-block;
  margin-top:7px;
  padding:5px 9px;
  border-radius:999px;
  background:#26303b;
  color:#dce3ea;
  font-size:12px;
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px
}

.stat{
  background:#0e141b;
  border:1px solid #202a34;
  border-radius:11px;
  padding:12px
}

.name{
  color:#9ca7b5;
  font-size:12px
}

.val{
  font-size:19px;
  font-weight:800;
  margin-top:4px
}

.event{
  padding:10px;
  margin:7px 0;
  background:#0e141b;
  border-radius:10px
}

.hidden{
  display:none
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  max-height:450px;
  overflow:auto;
  background:#080c11;
  padding:12px;
  border-radius:10px;
  font-size:12px
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr
  }

  .teams{
    font-size:18px
  }

  .score{
    font-size:32px
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>⚽ Live Match Stats V4</h1>

    <p class="muted">
      Digite os dois times, por exemplo:
      <b>FCSB x Sepsi</b>
    </p>

    <input
      id="q"
      placeholder="FCSB x Sepsi"
      autocomplete="off"
    >

    <button
      id="loadBtn"
      class="go"
      onclick="loadMatch()"
    >
      Carregar
    </button>

    <button
      id="refreshBtn"
      class="refresh"
      onclick="loadMatch(true)"
    >
      🔄 Atualizar
    </button>

    <div id="msg" class="status muted"></div>

  </div>

  <div id="game" class="card hidden">

    <div class="match">

      <div>

        <div
          id="teams"
          class="teams"
        >
          -
        </div>

        <div
          id="status"
          class="badge"
        >
          -
        </div>

      </div>

      <div
        id="score"
        class="score"
      >
        - x -
      </div>

    </div>

  </div>

  <div id="statsCard" class="card hidden">

    <h2>📊 Estatísticas</h2>

    <div
      id="statsGrid"
      class="grid"
    ></div>

  </div>

  <div id="eventsCard" class="card hidden">

    <h2>🚨 Eventos</h2>

    <div id="events"></div>

  </div>

  <div id="rawCard" class="card hidden">

    <h2>🔧 Dados da API</h2>

    <pre id="raw"></pre>

  </div>

</div>

<script>

let currentInput = '';

function setMessage(text,type='muted'){

  const el =
    document.getElementById('msg');

  el.className =
    'status '+type;

  el.textContent =
    text;
}

function show(id){

  document
    .getElementById(id)
    .classList
    .remove('hidden');
}

function hide(id){

  document
    .getElementById(id)
    .classList
    .add('hidden');
}

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function addStat(name,home,away){

  const grid =
    document.getElementById('statsGrid');

  const div =
    document.createElement('div');

  div.className='stat';

  div.innerHTML =
    '<div class="name">'+
      escapeHTML(name)+
    '</div>'+
    '<div class="val">'+
      escapeHTML(home ?? '-')+
      ' × '+
      escapeHTML(away ?? '-')+
    '</div>';

  grid.appendChild(div);
}

function renderStatistics(statistics){

  const grid =
    document.getElementById('statsGrid');

  grid.innerHTML='';

  if(
    !Array.isArray(statistics) ||
    !statistics.length
  ){
    grid.innerHTML =
      '<div class="muted">'+
      'Estatísticas não disponíveis para esta partida.'+
      '</div>';

    show('statsCard');

    return;
  }

  statistics.forEach(teamData=>{

    const teamName =
      teamData.team?.name ||
      'Equipe';

    const items =
      teamData.statistics || [];

    items.forEach(item=>{

      if(
        item.type === undefined &&
        item.value === undefined
      ){
        return;
      }

      let value =
        item.value;

      if(
        value === null ||
        value === undefined
      ){
        value='-';
      }

      addStat(
        teamName+' — '+item.type,
        value,
        ''
      );
    });

  });

  show('statsCard');
}

function renderEvents(events){

  const box =
    document.getElementById('events');

  box.innerHTML='';

  if(
    !Array.isArray(events) ||
    !events.length
  ){
    box.innerHTML =
      '<div class="muted">'+
      'Nenhum evento disponível.'+
      '</div>';

    show('eventsCard');

    return;
  }

  events
    .slice()
    .reverse()
    .forEach(event=>{

      const div =
        document.createElement('div');

      div.className='event';

      const minute =
        event.time?.elapsed ??
        '';

      const team =
        event.team?.name ??
        '';

      const player =
        event.player?.name ??
        '';

      const assist =
        event.assist?.name ??
        '';

      let text =
        minute
        ? minute+"' — "
        : '';

      text +=
        event.type ||
        'Evento';

      if(event.detail){
        text +=
          ' — '+event.detail;
      }

      if(team){
        text +=
          ' — '+team;
      }

      if(player){
        text +=
          ' — '+player;
      }

      if(assist){
        text +=
          ' — assistência: '+assist;
      }

      div.textContent=text;

      box.appendChild(div);
    });

  show('eventsCard');
}

function renderMatch(data){

  const fixture =
    data.fixture;

  if(!fixture){
    throw new Error(
      'A API não retornou os dados da partida.'
    );
  }

  const home =
    fixture.teams?.home?.name ||
    'Casa';

  const away =
    fixture.teams?.away?.name ||
    'Fora';

  const homeGoals =
    fixture.goals?.home ??
    0;

  const awayGoals =
    fixture.goals?.away ??
    0;

  const status =
    fixture.fixture?.status?.long ||
    fixture.fixture?.status?.short ||
    '-';

  document
    .getElementById('teams')
    .textContent =
      home+' x '+away;

  document
    .getElementById('score')
    .textContent =
      homeGoals+' x '+awayGoals;

  document
    .getElementById('status')
    .textContent =
      status;

  show('game');

  renderStatistics(
    data.statistics
  );

  renderEvents(
    data.events
  );
}

async function loadMatch(refresh=false){

  const input =
    document
      .getElementById('q')
      .value
      .trim();

  if(!input){

    setMessage(
      'Digite os nomes dos dois times.',
      'err'
    );

    return;
  }

  currentInput=input;

  const loadBtn =
    document.getElementById('loadBtn');

  const refreshBtn =
    document.getElementById('refreshBtn');

  loadBtn.disabled=true;
  refreshBtn.disabled=true;

  setMessage(
    refresh
      ? 'Atualizando partida...'
      : 'Procurando a partida...',
    'loading'
  );

  try{

    const response =
      await fetch(
        '/api/match?q='+
        encodeURIComponent(input)+
        '&t='+Date.now(),
        {
          cache:'no-store'
        }
      );

    let result;

    try{
      result =
        await response.json();
    }catch{
      throw new Error(
        'O servidor retornou uma resposta inválida.'
      );
    }

    if(!response.ok){

      throw new Error(
        result.details ||
        result.error ||
        'Erro ao consultar a API.'
      );
    }

    if(!result.ok){

      throw new Error(
        result.details ||
        result.error ||
        'Partida não encontrada.'
      );
    }

    renderMatch(
      result.data
    );

    document
      .getElementById('raw')
      .textContent =
        JSON.stringify(
          result,
          null,
          2
        );

    show('rawCard');

    setMessage(
      'Partida carregada com sucesso.',
      'ok'
    );

  }catch(error){

    console.error(error);

    setMessage(
      'Erro: '+error.message,
      'err'
    );

  }finally{

    loadBtn.disabled=false;
    refreshBtn.disabled=false;
  }
}

document
  .getElementById('q')
  .addEventListener(
    'keydown',
    event=>{
      if(event.key==='Enter'){
        loadMatch();
      }
    }
  );

</script>

</body>
</html>
